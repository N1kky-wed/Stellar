<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Star Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Lines -->
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- PWA Maskable Safe Padding Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />

  <!-- Outer Ring Constellation -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#line-glow)" stroke-width="2.5" stroke-dasharray="10 15" opacity="0.4" />

  <!-- Inner Concentric Orbit -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 8" opacity="0.6" />

  <!-- Secondary Orbit Rotated -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#line-glow)" stroke-width="2" transform="rotate(-30, 256, 256)" opacity="0.3" />

  <!-- Glow Backdrop -->
  <circle cx="256" cy="256" r="120" fill="url(#core-glow)" />

  <!-- Connecting Node Lines -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />

  <!-- Outer Star Constellation Nodes -->
  <circle cx="256" cy="96" r="6" fill="#00f0ff" />
  <circle cx="256" cy="416" r="6" fill="#d946ef" />
  <circle cx="96" cy="256" r="6" fill="#00f0ff" />
  <circle cx="416" cy="256" r="6" fill="#d946ef" />
  
  <circle cx="143" cy="143" r="4" fill="#cbd5e1" opacity="0.8" />
  <circle cx="369" cy="369" r="4" fill="#cbd5e1" opacity="0.8" />
  <circle cx="143" cy="369" r="4" fill="#cbd5e1" opacity="0.8" />
  <circle cx="369" cy="143" r="4" fill="#cbd5e1" opacity="0.8" />

  <!-- Star Symbol (Geometric Star Core) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- 8-Point Star -->
    <path d="M 0,-64 L 14,-14 L 64,0 L 14,14 L 0,64 L -14,14 L -64,0 L -14,-14 Z" fill="#ffffff" />
    <path d="M 0,-40 L 9,-9 L 40,0 L 9,9 L 0,40 L -9,9 L -40,0 L -9,-9 Z" fill="#00f0ff" opacity="0.8" />
    <path d="M 0,-30 L 7,-7 L 30,0 L 7,7 L 0,30 L -7,7 L -30,0 L -7,-7 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Rotated Thin Points -->
    <path d="M 0,-45 L 8,-8 L 45,0 L 8,8 L 0,45 L -8,8 L -45,0 L -8,-8 Z" fill="#d946ef" opacity="0.6" transform="rotate(45)" />

    <!-- Center Bright Dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
