server {
    listen 443 ssl;
    server_name stellarai.live *.stellarai.live;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/stellarai.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarai.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://unix:/home/stellaradmin/my_app/stellar.sock;
        
        proxy_set_header Host $http_host; 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        send_timeout 3600;
        
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
    }

    location /apps/ {
        proxy_pass http://unix:/home/stellaradmin/my_app/stellar.sock;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        send_timeout 3600;
        
        proxy_buffering off;
        proxy_cache off;
        
        client_max_body_size 50M;
    }
}

server {
    listen 80;
    server_name stellarai.live *.stellarai.live;
    return 301 https://$host$request_uri;
}
