name: Verify Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Dependencies
      run: |
        npm install -g prettier

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Python Syntax Compilation Check
      run: |
        for file in $(git ls-files "*.py"); do
          if [[ "$file" != *"dockerfiles/"* ]]; then
            python -m py_compile "$file"
          fi
        done

    - name: JavaScript Syntax Check
      run: |
        for file in $(git ls-files "*.js"); do
          node --check "$file"
        done

    - name: HTML and CSS Syntax Check
      run: |
        HTML_CSS_FILES=$(git ls-files "*.html" "*.css")
        if [ ! -z "$HTML_CSS_FILES" ]; then
          prettier --check $HTML_CSS_FILES || PRETTIER_EXIT=$?
          if [ ! -z "$PRETTIER_EXIT" ] && [ $PRETTIER_EXIT -eq 2 ]; then
            echo "Prettier syntax check failed."
            exit 2
          fi
        fi

    - name: Run Pytest Suite
      run: |
        pytest
