<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar &mdash; Web Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
    />
    <style>
      :root {
        --bg-base: #010103;
        --bg-step: #08080a;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-active: rgba(255, 255, 255, 0.15);
        --card-bg: #0e0e12;
        --text-primary: #f5f6f8;
        --text-secondary: #94a3b8;
        --accent-success: #10b981;
        --accent-error: #ef4444;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-base);
        color: var(--text-primary);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
      }

      /* Layout split: Sidebar + Main Terminal */
      .sidebar {
        width: 320px;
        background: var(--bg-step);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .sidebar-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .logo {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--text-primary);
        text-transform: uppercase;
      }
      .sidebar-title {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 18px;
        padding-left: 2px;
      }

      .deployment-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* Firefox */
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
      }
      /* Webkit browsers (Chrome, Safari, Edge) */
      .deployment-list::-webkit-scrollbar {
        width: 4px;
      }
      .deployment-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .deployment-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .deployment-list::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .deployment-item {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        transition: all 0.2s ease;
      }
      .deployment-item:hover {
        background: rgba(255, 255, 255, 0.03);
        border-color: rgba(255, 255, 255, 0.05);
      }
      .deployment-item.active {
        background: var(--card-bg);
        border-color: var(--border-active);
      }
      .deployment-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .deployment-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .status-dot.running {
        background: var(--accent-success);
        box-shadow: 0 0 6px var(--accent-success);
      }
      .status-dot.stopped {
        background: var(--text-secondary);
      }
      .status-dot.notfound {
        background: var(--accent-error);
        box-shadow: 0 0 6px var(--accent-error);
      }
      .status-text {
        color: var(--text-secondary);
      }
      .deployment-subdomain {
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-family: "JetBrains Mono", monospace;
      }

      .sidebar-footer {
        padding: 20px;
        border-top: 1px solid var(--border-subtle);
      }
      .nav-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
      }

      /* Main Terminal Window */
      .main-terminal {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg-base);
      }

      .terminal-navbar {
        height: 64px;
        border-bottom: 1px solid var(--border-subtle);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .terminal-title-group {
        display: flex;
        flex-direction: column;
      }
      .terminal-active-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-primary);
      }
      .terminal-active-id {
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-family: "JetBrains Mono", monospace;
      }

      .terminal-controls {
        display: flex;
        gap: 8px;
      }
      .control-btn {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: "Inter", sans-serif;
      }
      .control-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: rgba(255, 255, 255, 0.04);
        color: var(--text-secondary);
      }
      .control-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .control-btn.btn-restart {
        border-color: rgba(99, 102, 241, 0.3);
        color: #818cf8;
      }
      .control-btn.btn-stop {
        border-color: rgba(239, 68, 68, 0.3);
        color: #f87171;
      }
      .control-btn.btn-start {
        border-color: rgba(16, 185, 129, 0.3);
        color: #34d399;
      }
      .control-btn.btn-restart:hover {
        background: rgba(99, 102, 241, 0.08);
      }
      .control-btn.btn-stop:hover {
        background: rgba(239, 68, 68, 0.08);
      }
      .control-btn.btn-start:hover {
        background: rgba(16, 185, 129, 0.08);
      }
      .control-btn.btn-upload {
        border-color: rgba(59, 130, 246, 0.3);
        color: #60a5fa;
      }
      .control-btn.btn-upload:hover {
        background: rgba(59, 130, 246, 0.08);
      }

      .drag-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(1, 1, 3, 0.85);
        backdrop-filter: blur(4px);
        border: 2px dashed #60a5fa;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .drag-overlay.active {
        opacity: 1;
      }
      .drag-overlay-text {
        font-size: 1rem;
        font-weight: 600;
        color: #60a5fa;
      }

      .terminal-viewport {
        flex: 1;
        padding: 16px;
        background: #010103;
        position: relative;
        overflow: hidden;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }

      /* Customize xterm.js internal scrollbar */
      .xterm-viewport::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .xterm-viewport::-webkit-scrollbar-track {
        background: transparent;
      }
      .xterm-viewport::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }
      .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .xterm-viewport {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Stellar Console</div>
        <div class="sidebar-title">Deployments</div>
      </div>
      <div class="deployment-list" id="deploymentList">
        <div
          style="
            padding: 12px;
            color: var(--text-secondary);
            font-size: 0.85rem;
          "
        >
          Loading active containers...
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="nav-btn" onclick="window.location.href = '/'">
          <svg
            width="16"
            height="16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            />
          </svg>
          Return to Chat
        </button>
      </div>
    </div>

    <div class="main-terminal">
      <div class="terminal-navbar">
        <div class="terminal-title-group">
          <div class="terminal-active-name" id="activeName">
            No deployment selected
          </div>
          <div class="terminal-active-id" id="activeId">-</div>
        </div>
        <div class="terminal-controls">
          <button class="control-btn" id="btnLogs" onclick="fetchLogs()">
            Logs
          </button>
          <button
            class="control-btn btn-restart"
            id="btnRestart"
            onclick="triggerAction('restart')"
          >
            Restart
          </button>
          <button
            class="control-btn btn-stop"
            id="btnStop"
            onclick="triggerAction('stop')"
          >
            Stop
          </button>
          <button
            class="control-btn btn-start"
            id="btnStart"
            onclick="triggerAction('start')"
          >
            Start
          </button>
          <button class="control-btn" id="btnCopy" onclick="copyConsoleLogs()">
            Copy
          </button>
          <button class="control-btn" id="btnClear" onclick="clearTerminal()">
            Clear
          </button>
          <button
            class="control-btn btn-upload"
            id="btnUpload"
            onclick="triggerFileUpload()"
            disabled
          >
            Upload
          </button>
          <input
            type="file"
            id="fileInput"
            style="display: none"
            multiple
            onchange="handleFileSelect(event)"
          />
        </div>
      </div>

      <div class="terminal-viewport">
        <div id="dragOverlay" class="drag-overlay">
          <svg
            width="40"
            height="40"
            fill="none"
            viewBox="0 0 24 24"
            stroke="#60a5fa"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            />
          </svg>
          <div class="drag-overlay-text">
            Drop files here to upload to container (/app)
          </div>
        </div>
        <div id="terminal"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
      let containersList = [];
      let currentContainer = null;
      let term = null;
      let fitAddon = null;
      let eventSource = null;
      let sessionId = null;

      let inputQueue = [];
      let isSendingInput = false;

      const deploymentList = document.getElementById("deploymentList");
      const activeName = document.getElementById("activeName");
      const activeId = document.getElementById("activeId");

      document.addEventListener("DOMContentLoaded", () => {
        initXterm();
        loadContainers();
      });

      function initXterm() {
        term = new Terminal({
          cursorBlink: true,
          theme: {
            background: "#010103",
            foreground: "#cbd5e1",
            cursor: "#cbd5e1",
            selectionBackground: "rgba(255, 255, 255, 0.15)",
            black: "#000000",
            red: "#ef4444",
            green: "#10b981",
            yellow: "#f59e0b",
            blue: "#3b82f6",
            magenta: "#d946ef",
            cyan: "#06b6d4",
            white: "#cbd5e1",
          },
          fontFamily: '"JetBrains Mono", monospace',
          fontSize: 14,
          lineHeight: 1.2,
        });

        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById("terminal"));
        fitAddon.fit();

        term.write("\x1b[35mStellar Terminal Initialized.\x1b[0m\r\n");
        term.write(
          "Select a deployment in the sidebar to allocate a persistent shell session.\r\n\r\n",
        );

        term.onData((data) => {
          if (sessionId) {
            sendInput(data);
          }
        });

        // Ctrl+V paste: let browser fire native paste event, intercept it below
        // Ctrl+C copy: copy selection if text is selected, otherwise send SIGINT
        term.attachCustomKeyEventHandler((event) => {
          if (event.type === "keydown" && event.ctrlKey && event.key === "v") {
            return false; // let browser handle it -> fires paste event
          }
          if (event.type === "keydown" && event.ctrlKey && event.key === "c") {
            const selection = term.getSelection();
            if (selection) {
              navigator.clipboard.writeText(selection);
              return false;
            }
          }
          return true;
        });

        // Capture native paste event on the terminal container
        document.getElementById("terminal").addEventListener("paste", (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData(
            "text",
          );
          if (text && sessionId) {
            sendInput(text);
          }
        });

        window.addEventListener("resize", () => {
          resizeTerminal();
        });
      }

      function sendInput(data) {
        inputQueue.push(data);
        processInputQueue();
      }

      async function processInputQueue() {
        if (isSendingInput || inputQueue.length === 0 || !sessionId) return;
        isSendingInput = true;

        const input = inputQueue.join("");
        inputQueue = [];

        try {
          await fetch(`/api/ssh/terminal/input/${sessionId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ input: input }),
          });
        } catch (e) {
          console.error("Failed to send terminal input:", e);
        } finally {
          isSendingInput = false;
          setTimeout(processInputQueue, 0);
        }
      }

      function resizeTerminal() {
        if (!term || !fitAddon || !sessionId) return;
        fitAddon.fit();
        const dims = fitAddon.proposeDimensions();
        if (dims && dims.cols && dims.rows) {
          fetch(`/api/ssh/terminal/resize/${sessionId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cols: dims.cols, rows: dims.rows }),
          });
        }
      }

      async function loadContainers() {
        try {
          const res = await fetch("/api/ssh/containers");
          const data = await res.json();
          containersList = data.containers || [];
          deploymentList.innerHTML = "";

          if (containersList.length === 0) {
            deploymentList.innerHTML =
              '<div style="padding: 12px; color: var(--accent-error);">No active deployments found.</div>';
            term.write(
              "\r\n\x1b[31m[No active container deployments found for your account.]\x1b[0m\r\n",
            );
            return;
          }

          containersList.forEach((c) => {
            const isRunning = c.live_status === "running";
            const isNotFound = c.live_status === "not_found";
            const item = document.createElement("div");
            item.className = `deployment-item ${currentContainer && currentContainer.process_id === c.process_id ? "active" : ""}`;
            item.id = `item-${c.process_id}`;
            item.onclick = () => selectContainer(c.process_id);

            let statusClass = "stopped";
            if (isRunning) statusClass = "running";
            else if (isNotFound) statusClass = "notfound";

            let displayStatus = c.live_status;
            if (isNotFound) displayStatus = "deleted";

            item.innerHTML = `
                <div class="deployment-meta">
                    <span class="deployment-name">${c.name}</span>
                    <span class="status-indicator">
                        <span class="status-dot ${statusClass}"></span>
                        <span class="status-text">${displayStatus}</span>
                    </span>
                </div>
                <div class="deployment-subdomain">${c.subdomain}.stellarai.site</div>
            `;
            deploymentList.appendChild(item);
          });

          // Auto-select first container if none active, or refresh current selection status
          if (!currentContainer && containersList.length > 0) {
            selectContainer(containersList[0].process_id);
          } else if (currentContainer) {
            selectContainer(currentContainer.process_id);
          }
        } catch (e) {
          term.write(
            `\r\n\x1b[31m[Failed to load deployments: ${e.message}]\x1b[0m\r\n`,
          );
        }
      }

      async function selectContainer(pid) {
        currentContainer = containersList.find((c) => c.process_id === pid);
        if (!currentContainer) return;

        // Toggle active classes
        document
          .querySelectorAll(".deployment-item")
          .forEach((el) => el.classList.remove("active"));
        const activeEl = document.getElementById(`item-${pid}`);
        if (activeEl) activeEl.classList.add("active");

        activeName.textContent = currentContainer.name;
        activeId.textContent = `Process ID: ${currentContainer.process_id}`;

        const status = currentContainer.live_status;
        const isRunning = status === "running";
        const isNotFound = status === "not_found";

        document.getElementById("btnStart").disabled = isRunning || isNotFound;
        document.getElementById("btnStop").disabled = !isRunning;
        document.getElementById("btnRestart").disabled = !isRunning;
        document.getElementById("btnUpload").disabled = !isRunning;

        if (isNotFound) {
          term.write(
            `\r\n\x1b[31m[!] WARNING: Deployment "${currentContainer.name}" was not found (likely deleted or lease expired). Please request a rebuild in the main chat.\x1b[0m\r\n`,
          );
          closeActiveSession();
        } else if (!isRunning) {
          term.write(
            `\r\n\x1b[33m[*] Deployment "${currentContainer.name}" is currently stopped. Click "Start" to boot the container.\x1b[0m\r\n`,
          );
          closeActiveSession();
        } else {
          // Start/reconnect to persistent PTY session
          await establishPTYSession(pid);
        }
      }

      function closeActiveSession() {
        sessionId = null;
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
      }

      async function establishPTYSession(pid) {
        closeActiveSession();
        term.clear();
        term.write(
          `\x1b[34m[*] Connecting to PTY console for ${currentContainer.name}...\x1b[0m\r\n`,
        );

        // Check for cached session ID in sessionStorage to enable seamless tab refreshes
        const cachedSid = sessionStorage.getItem(`stellar_term_sid_${pid}`);

        try {
          const startRes = await fetch(`/api/ssh/terminal/start/${pid}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: cachedSid }),
          });
          const startData = await startRes.json();

          if (startData.error) {
            term.write(
              `\r\n\x1b[31mError starting PTY shell: ${startData.error}\x1b[0m\r\n`,
            );
            return;
          }

          sessionId = startData.session_id;
          sessionStorage.setItem(`stellar_term_sid_${pid}`, sessionId);
          term.focus();

          // Open low-latency SSE output stream
          eventSource = new EventSource(
            `/api/ssh/terminal/stream/${sessionId}`,
          );

          let hasLoadedHistory = false;

          eventSource.addEventListener("history", (event) => {
            if (!hasLoadedHistory) {
              const data = JSON.parse(event.data);
              if (data.output) {
                term.clear();
                term.write(data.output);
              }
              hasLoadedHistory = true;
            }
          });

          eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.output) {
              term.write(data.output);
            }
          };

          eventSource.onerror = (err) => {
            if (eventSource.readyState === EventSource.CLOSED) {
              console.error("Terminal stream closed:", err);
              term.write(
                "\r\n\x1b[31m[Terminal session stream disconnected]\x1b[0m\r\n",
              );
              closeActiveSession();
            } else {
              console.warn("Terminal stream reconnecting...", err);
            }
          };

          // Fit window and propagate SIGWINCH resize settings
          setTimeout(resizeTerminal, 100);
        } catch (e) {
          term.write(
            `\r\n\x1b[31mFailed to establish shell session: ${e.message}\x1b[0m\r\n`,
          );
        }
      }

      function clearTerminal() {
        if (term) term.clear();
      }

      async function fetchLogs() {
        if (!currentContainer) return;
        term.write(
          `\r\n\x1b[34m[*] Fetching container stdout/stderr logs...\x1b[0m\r\n`,
        );
        try {
          const res = await fetch(
            `/api/ssh/container/${currentContainer.process_id}/action`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "logs",
                app_type: currentContainer.app_type,
              }),
            },
          );
          const data = await res.json();
          if (data.logs !== undefined && data.logs !== null) {
            if (data.logs.trim() === "") {
              term.write(
                "\x1b[33m(No standard output logs recorded for this container)\x1b[0m\r\n",
              );
            } else {
              // Normalize newlines for xterm.js
              const formattedLogs = data.logs.replace(/\r?\n/g, "\r\n");
              term.write(formattedLogs + "\r\n");
            }
          } else if (data.error) {
            term.write(`\x1b[31mError fetching logs: ${data.error}\x1b[0m\r\n`);
          }
        } catch (e) {
          term.write(`\x1b[31mFailed to fetch logs: ${e.message}\x1b[0m\r\n`);
        }
      }

      async function triggerAction(act) {
        if (!currentContainer) return;
        term.write(
          `\r\n\x1b[34m[*] Triggering container ${act.toUpperCase()}...\x1b[0m\r\n`,
        );
        try {
          const res = await fetch(
            `/api/ssh/container/${currentContainer.process_id}/action`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: act,
                app_type: currentContainer.app_type,
              }),
            },
          );
          const data = await res.json();
          if (data.message) {
            term.write(`\x1b[32m${data.message}\x1b[0m\r\n`);
            setTimeout(loadContainers, 1500);
          } else if (data.error) {
            term.write(`\x1b[31mError: ${data.error}\x1b[0m\r\n`);
          }
        } catch (e) {
          term.write(`\x1b[31mAction failed: ${e.message}\x1b[0m\r\n`);
        }
      }

      function copyConsoleLogs() {
        if (!term) return;
        let buffer = "";
        const lineCount = term.buffer.active.length;
        for (let i = 0; i < lineCount; i++) {
          const line = term.buffer.active.getLine(i);
          if (line) {
            buffer += line.translateToString(true) + "\n";
          }
        }

        navigator.clipboard
          .writeText(buffer.trim())
          .then(() => {
            const btn = document.getElementById("btnCopy");
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            btn.style.color = "var(--accent-success)";
            setTimeout(() => {
              btn.textContent = originalText;
              btn.style.color = "";
            }, 1500);
          })
          .catch((err) => {
            term.write(
              `\r\n\x1b[31mFailed to copy buffer: ${err.message}\x1b[0m\r\n`,
            );
          });
      }

      function triggerFileUpload() {
        if (!currentContainer || currentContainer.live_status !== "running")
          return;
        document.getElementById("fileInput").click();
      }

      async function handleFileSelect(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        await uploadFilesToContainer(files);
        event.target.value = "";
      }

      async function uploadFilesToContainer(files) {
        if (!currentContainer || currentContainer.live_status !== "running") {
          alert("Please select an active running container first.");
          return;
        }

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
          formData.append("file", files[i]);
        }

        const fileNames = Array.from(files)
          .map((f) => f.name)
          .join(", ");
        if (term) {
          term.write(
            `\r\n\x1b[33m[*] Uploading ${files.length} file(s) [${fileNames}] to /app...\x1b[0m\r\n`,
          );
        }

        try {
          const res = await fetch(
            `/api/ssh/container/${currentContainer.process_id}/upload`,
            {
              method: "POST",
              body: formData,
            },
          );
          const data = await res.json();
          if (res.ok) {
            if (term) {
              term.write(
                `\x1b[32m[✓] ${data.message || "Upload complete."}\x1b[0m\r\n`,
              );
            }
          } else {
            if (term) {
              term.write(
                `\x1b[31m[!] Upload failed: ${data.error || "Server error"}\x1b[0m\r\n`,
              );
            }
          }
        } catch (err) {
          if (term) {
            term.write(
              `\x1b[31m[!] Network error during upload: ${err.message}\x1b[0m\r\n`,
            );
          }
        }
      }

      // Drag and Drop files onto terminal viewport
      window.addEventListener("load", () => {
        const viewport = document.querySelector(".terminal-viewport");
        const dragOverlay = document.getElementById("dragOverlay");
        if (!viewport || !dragOverlay) return;

        viewport.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (currentContainer && currentContainer.live_status === "running") {
            dragOverlay.classList.add("active");
          }
        });

        viewport.addEventListener("dragleave", (e) => {
          e.preventDefault();
          e.stopPropagation();
          dragOverlay.classList.remove("active");
        });

        viewport.addEventListener("drop", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          dragOverlay.classList.remove("active");

          if (!currentContainer || currentContainer.live_status !== "running")
            return;

          const files = e.dataTransfer.files;
          if (files && files.length > 0) {
            await uploadFilesToContainer(files);
          }
        });
      });
    </script>
  </body>
</html>
